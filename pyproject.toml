[tool.pytest.ini_options]
# Default collection targets the pure-Python core only (no QGIS install needed).
# tests/qgis/ is collected separately via scripts/run-qgis-tests.ps1, under the
# QGIS-bundled interpreter, because it imports `qgis`/`PyQt5`.
testpaths = ["tests"]
norecursedirs = ["tests/qgis", "tests/fixtures", ".venv", "field_survey_import/styles"]

[tool.ruff]
line-length = 100
target-version = "py39"  # matches metadata.txt qgisMinimumVersion's Python floor

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = [
    "N802",  # QGIS-mandated camelCase method names (initGui, classFactory, ...)
    "N803",  # QGIS-mandated camelCase parameter names in overridden Qt/QGIS methods
]

[tool.ruff.lint.per-file-ignores]
"field_survey_import/__init__.py" = ["N802"]
